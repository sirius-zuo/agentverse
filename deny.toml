# deny.toml — cargo-deny policy
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Pre-existing advisories in transitive deps that cannot be fixed immediately.
# Each entry documents why and what would be needed to resolve it.
ignore = [
    # rsa: Marvin Attack timing sidechannel — transitive dep, no direct fix
    { id = "RUSTSEC-2023-0071", reason = "transitive dep; no fix available upstream yet" },
    # sqlx 0.7: binary protocol misinterpretation — upgrading to 0.8 is a breaking API change
    { id = "RUSTSEC-2024-0363", reason = "sqlx 0.7 transitive issue; upgrade to 0.8 tracked separately" },
    # rustls-webpki: three CVEs in TLS cert validation — transitive via reqwest/rustls
    { id = "RUSTSEC-2026-0098", reason = "transitive dep rustls-webpki; upgrade pending" },
    { id = "RUSTSEC-2026-0099", reason = "transitive dep rustls-webpki; upgrade pending" },
    { id = "RUSTSEC-2026-0104", reason = "transitive dep rustls-webpki; upgrade pending" },
    # lru: unsound IterMut — transitive dep, not directly depended on
    { id = "RUSTSEC-2026-0002", reason = "transitive dep lru unsound IterMut; not directly used" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
