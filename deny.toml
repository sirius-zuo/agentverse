# deny.toml — cargo-deny policy
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Pre-existing advisories in transitive deps that cannot be fixed immediately.
# Each entry documents why and what would be needed to resolve it.
ignore = [
    # rsa: Marvin Attack timing sidechannel — transitive dep, no upstream fix available
    { id = "RUSTSEC-2023-0071", reason = "transitive dep; no fix available upstream yet" },
    # lru: unsound IterMut — transitive via lancedb/tantivy, not directly used
    { id = "RUSTSEC-2026-0002", reason = "transitive dep lru unsound IterMut; not directly used" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
