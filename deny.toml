# deny.toml — cargo-deny policy
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Pre-existing advisories in transitive deps that cannot be fixed immediately.
# Each entry documents why and what would be needed to resolve it.
ignore = [
    # unmaintained transitive deps — no direct fix available
    { id = "RUSTSEC-2025-0052", reason = "async-std discontinued; transitive dep via lancedb" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; transitive dep" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive dep" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = [
    "https://github.com/sirius-zuo/flume",
    "https://github.com/sirius-zuo/lazy-static.rs",
]
